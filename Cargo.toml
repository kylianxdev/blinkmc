[package]
name = "blink"
version = "2.2.0"
authors = ["Kylian de Groot", "Tim Visee (lazymc)"]
license = "GPL-3.0"
readme = "README.md"
homepage = "https://kylianxdev.github.io/blinkmc/"
repository = "https://github.com/kylianxdev/blinkmc"
description = "Your Minecraft server sleeps when nobody plays and wakes up in 0.1 seconds. Based on lazymc."
keywords = ["minecraft", "server", "idle", "cli"]
categories = ["command-line-interface", "games"]
exclude = ["/.github", "/contrib"]
edition = "2021"
rust-version = "1.74.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "z"
panic = "abort"

[features]
default = []

# RCON support
# Allow use of RCON to manage (stop) server.
# Required on Windows.
rcon = ["rust_rcon"]

# Lobby support
# Add lobby join method, keeps client in fake lobby world until server is ready.
lobby = ["md-5", "uuid"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.1"
chrono = "0.4"
clap = { version = "4.0.32", default-features = false, features = [
    "std",
    "help",
    "usage",
    "cargo",
    "env",
] }
colored = "2.0"
derive_builder = "0.20"
dotenv = "0.15"
flate2 = { version = "1.0", default-features = false, features = ["default"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }
log = "0.4"
minecraft-protocol = { git = "https://github.com/mliem2k/rust-minecraft-protocol", rev = "359fb4a" }
named-binary-tag = "0.6"
nix = { version = "0.28", features = ["process", "signal"] }
proxy-protocol = "0.5"
quartz_nbt = "0.2"
rand = "0.8"
serde = "1.0"
serde_json = "1.0"
shlex = "1.1"
thiserror = "1.0"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "io-util",
    "io-std",
    "net",
    "macros",
    "time",
    "process",
    "signal",
    "sync",
    "fs",
] }
toml = "0.8"
version-compare = "0.2"

# Feature: rcon
rust_rcon = { package = "rcon", version = "0.6", default-features = false, features = ["rt-tokio"], optional = true }

# Feature: lobby
md-5 = { version = "0.10", optional = true }
uuid = { version = "1.7", optional = true, features = ["v3"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "processthreadsapi",
    "handleapi",
    "ntdef",
    "minwindef",
    "psapi",
] }
