name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: blink-linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: blink-linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: blink-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: blink-macos-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: blink-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          src=target/${{ matrix.target }}/release/blink
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "dist/${{ matrix.name }}"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  # A real Paper server on every OS: start, save and freeze, wake up with a join, freeze again, stop
  smoke:
    name: test on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, binary: blink-linux-x64 }
          - { os: macos-latest, binary: blink-macos-arm64 }
          - { os: windows-latest, binary: blink-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: bin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Paper
        shell: bash
        run: |
          mkdir server
          url=$(curl -fsSL https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python -c "import json,sys; print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          curl -fsSL "$url" -o server/paper.jar
          chmod +x bin/*
      - name: Test
        shell: bash
        run: python tools/smoke-test.py "bin/${{ matrix.binary }}" server

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for f in blink-*; do sha256sum "$f" > "$f.sha256"; done
          ls -l
          gh release upload "${GITHUB_REF_NAME}" * --clobber -R "${GITHUB_REPOSITORY}" \
            || gh release create "${GITHUB_REF_NAME}" * --title "Blink ${GITHUB_REF_NAME#v}" --generate-notes -R "${GITHUB_REPOSITORY}"
